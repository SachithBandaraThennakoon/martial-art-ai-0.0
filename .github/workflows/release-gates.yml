name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python backend/scripts/check_repository_hygiene.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:production
        env:
          VITE_API_BASE_URL: https://api.ci.invalid
          VITE_WS_BASE_URL: wss://api.ci.invalid
          VITE_COACH_API_BASE_URL: https://api.ci.invalid
          VITE_PAYPAL_CLIENT_ID: CI-PAYPAL-CLIENT
          VITE_PAYPAL_STARTER_PLAN_ID: P-CI-STARTER
          VITE_PAYPAL_PRO_PLAN_ID: P-CI-PRO
          VITE_PAYPAL_ELITE_PLAN_ID: P-CI-ELITE

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: martial_art_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/martial_art_ai_test
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      RATE_LIMIT_HASH_KEY: ci-only-rate-limit-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-email.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-email.txt pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pip_audit -r requirements-email.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py routers services scripts models tests
      - run: python -m scripts.validate_production_config
        env:
          APP_ENV: production
          APP_VERSION: ci-release
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/martial_art_ai_test?sslmode=require
          SECRET_KEY: ci-production-contract-secret-key-123456789
          RATE_LIMIT_HASH_KEY: ci-production-contract-rate-key-987654321
          APPLICATIONINSIGHTS_CONNECTION_STRING: InstrumentationKey=ci
          FRONTEND_URL: https://app.ci.invalid
          CORS_ORIGINS: https://app.ci.invalid
          PAYPAL_MODE: live
          PAYPAL_CLIENT_ID: CI-PAYPAL-CLIENT
          PAYPAL_CLIENT_SECRET: CI-PAYPAL-SECRET
          PAYPAL_WEBHOOK_ID: CI-PAYPAL-WEBHOOK
          PAYPAL_STARTER_PLAN_ID: P-CI-STARTER
          PAYPAL_PRO_PLAN_ID: P-CI-PRO
          PAYPAL_ELITE_PLAN_ID: P-CI-ELITE
          TAPE_STORAGE_MODE: azure
          TAPE_STORAGE_ACCOUNT_URL: https://storage.ci.invalid
          TAPE_STORAGE_CONTAINER: practice-tapes
          EMAIL_PROVIDER: azure
          AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING: endpoint=https://mail.ci.invalid/;accesskey=ci
          AZURE_EMAIL_SENDER: security@ci.invalid
